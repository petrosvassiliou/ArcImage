name: ArcImage Android & Googlebook OS CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Localization Verification, Android Lint & JVM Unit Tests
  # ---------------------------------------------------------------------------
  lint-and-unit-tests:
    name: i18n Check, Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate 6-Language Localization & XML Resource Parity
        run: |
          python3 - <<'EOF'
          import os, re, xml.etree.ElementTree as ET
          root = "app/src/main/res"
          locales = ["values", "values-de", "values-it", "values-fr", "values-es", "values-el"]
          maps = {}
          trans_keys = set()
          for loc in locales:
              tree = ET.parse(os.path.join(root, loc, "strings.xml"))
              entries = {}
              for el in tree.getroot().findall("string"):
                  k = el.attrib["name"]
                  v = el.text or ""
                  if loc == "values" and el.attrib.get("translatable", "true") != "false":
                      trans_keys.add(k)
                  assert not re.findall(r"(?<!\\)'", v), f"Unescaped quote in {loc}/{k}"
                  entries[k] = v
              maps[loc] = entries
          ph = re.compile(r"%\d+\$[sd]")
          for k in sorted(trans_keys):
              expected = sorted(ph.findall(maps["values"][k]))
              for loc in locales[1:]:
                  assert k in maps[loc], f"Missing {k} in {loc}"
                  assert sorted(ph.findall(maps[loc][k])) == expected, f"Placeholder mismatch in {loc}/{k}"
          print(f"Verified {len(trans_keys)} localized string keys across {len(locales)} languages.")
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install API 36 Platform
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || \
            "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Run JVM Unit Tests & Android Lint
        run: gradle testDebugUnitTest lintDebug --stacktrace

      - name: Upload Unit Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-and-lint-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html

  # ---------------------------------------------------------------------------
  # 2. Build Universal & ABI-Split APKs (ARM64 + x86_64 Googlebook OS)
  # ---------------------------------------------------------------------------
  build-apks:
    name: Build ARM64 & x86_64 APKs
    needs: lint-and-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install API 36 Platform
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || \
            "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Assemble Debug, Release & AndroidTest APKs (Universal + arm64-v8a + x86_64)
        run: gradle assembleDebug assembleRelease assembleDebugAndroidTest --stacktrace

      - name: Upload ArcImage APKs (Googlebook OS x86_64, ARM64 & Universal)
        uses: actions/upload-artifact@v4
        with:
          name: arcimage-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk

  # ---------------------------------------------------------------------------
  # 3. Compose UI & Image Encoder Instrumented Tests (x86_64 KVM Emulator)
  # ---------------------------------------------------------------------------
  instrumented-tests:
    name: Compose UI & Encoder Instrumented Tests
    if: github.event_name == 'workflow_dispatch'
    needs: lint-and-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install API 36 Platform
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || \
            "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Run Instrumented Tests on x86_64 Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          script: gradle connectedDebugAndroidTest --stacktrace

      - name: Upload Instrumented Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/connected/
