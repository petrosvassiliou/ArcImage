name: ArcImage Signed Release

# Builds a signed, Play-ready Android App Bundle (.aab) plus signed APKs
# (universal, arm64-v8a, x86_64 for Googlebook OS).
#  - Push a tag like v1.2.0  -> builds and publishes a GitHub Release.
#  - Run manually            -> builds and uploads the files as workflow artifacts only.

on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  signed-release:
    name: Signed AAB & APKs
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="${{ github.event.inputs.version_name }}"
          fi
          if ! echo "$NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$NAME' must look like MAJOR.MINOR.PATCH"; exit 1
          fi
          IFS=. read -r MA MI PA <<< "$NAME"
          CODE=$(( MA * 10000 + MI * 100 + PA ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building ArcImage $NAME (versionCode $CODE)"

      - name: Restore upload keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ARCIMAGE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ARCIMAGE_KEYSTORE_BASE64 is not set"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/arcimage-upload.jks"
          echo "ARCIMAGE_KEYSTORE_PATH=$RUNNER_TEMP/arcimage-upload.jks" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install API 36 Platform
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build signed release AAB & APKs
        env:
          ARCIMAGE_KEYSTORE_PASSWORD: ${{ secrets.ARCIMAGE_KEYSTORE_PASSWORD }}
          ARCIMAGE_KEY_ALIAS: ${{ secrets.ARCIMAGE_KEY_ALIAS }}
          ARCIMAGE_KEY_PASSWORD: ${{ secrets.ARCIMAGE_KEY_PASSWORD }}
        run: |
          set -e
          VERSION_ARGS="-PversionCode=${{ steps.version.outputs.code }} -PversionName=${{ steps.version.outputs.name }}"
          # Separate invocations: ABI splits apply to APKs only (AGP can't bundle with splits on)
          gradle bundleRelease --stacktrace $VERSION_ARGS
          gradle assembleRelease --stacktrace $VERSION_ARGS

      - name: Verify signatures & collect outputs
        run: |
          set -e
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          OUT="$RUNNER_TEMP/dist"; mkdir -p "$OUT"
          V="${{ steps.version.outputs.name }}"
          for apk in app/build/outputs/apk/release/*.apk; do
            case "$apk" in *unsigned*) echo "::error::Unsigned APK produced: $apk"; exit 1;; esac
            "$APKSIGNER" verify --print-certs "$apk" | head -n 3
            abi=$(basename "$apk" .apk | sed -E 's/^app-//; s/-release$//')
            cp "$apk" "$OUT/ArcImage-$V-$abi.apk"
          done
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab > /dev/null
          cp app/build/outputs/bundle/release/app-release.aab "$OUT/ArcImage-$V.aab"
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "DIST_DIR=$OUT" >> "$GITHUB_ENV"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arcimage-release-${{ steps.version.outputs.name }}
          path: ${{ env.DIST_DIR }}/*

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "$DIST_DIR"/* \
            --title "ArcImage ${{ steps.version.outputs.name }}" \
            --generate-notes

      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/arcimage-upload.jks"
