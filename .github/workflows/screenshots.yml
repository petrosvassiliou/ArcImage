name: Capture High-Res README Screenshots

on:
  workflow_dispatch:

jobs:
  capture-screenshots:
    name: Capture 2560x1600 & 1080x2400 Native Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install API 36 Platform
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || \
            "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Boot Android 14 KVM Emulator & Capture High-Res Screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          script: |
            gradle installDebug installDebugAndroidTest --stacktrace

            adb shell wm dismiss-keyguard || true
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell appops set com.arcimage.app MANAGE_EXTERNAL_STORAGE allow || true

            # Clean Android SystemUI Demo Mode (10:30, full Wi-Fi, 100% battery, zero notification clutter)
            adb shell settings put global sysui_demo_allowed 1
            adb shell am broadcast -a com.android.systemui.demo -e command enter
            adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 1030
            adb shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false
            adb shell am broadcast -a com.android.systemui.demo -e command network -e wifi show -e level 4 -e mobile hide
            adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false

            # 1. Googlebook OS / Tablet Landscape (2560x1600 @ 320 dpi)
            adb shell settings put system accelerometer_rotation 0
            adb shell cmd window user-rotation lock 0 || true
            adb shell wm size 2560x1600
            adb shell wm density 320
            sleep 2
            adb shell am instrument -w \
              -e class com.arcimage.app.ui.ScreenshotCaptureTest#captureDesktopScreenshots \
              -e captureScreenshots true \
              com.arcimage.app.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/desktop_inst.log
            grep -q "OK (1 test)" /tmp/desktop_inst.log

            # 2. Android Phone Portrait (1080x2400 @ 420 dpi)
            adb shell wm size 1080x2400
            adb shell wm density 420
            sleep 2
            adb shell am instrument -w \
              -e class com.arcimage.app.ui.ScreenshotCaptureTest#captureMobileScreenshots \
              -e captureScreenshots true \
              com.arcimage.app.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/mobile_inst.log
            grep -q "OK (1 test)" /tmp/mobile_inst.log

            mkdir -p screenshots_out
            adb pull /sdcard/Android/data/com.arcimage.app/files/screenshots/. screenshots_out/
            ls -lh screenshots_out/

      - name: Upload High-Res PNG Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: arcimage-highres-screenshots
          path: screenshots_out/*.png
